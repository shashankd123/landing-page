<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Use the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        /* Custom scrollbar for a better aesthetic in the textarea */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: #1f2937; }
        textarea::-webkit-scrollbar-thumb {
            background-color: #4b5563;
            border-radius: 20px;
            border: 3px solid #1f2937;
        }
        /* Styling for completed exercises */
        .exercise-done {
            text-decoration: line-through;
            color: #4b5563; /* Muted gray color */
        }
        .exercise-done span:last-child {
            color: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 flex flex-col h-screen overflow-hidden">

    <!-- Header Section -->
    <header class="text-center p-4 border-b border-gray-800">
        <h1 class="text-2xl sm:text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-500">
            Workout Planner
        </h1>
        <p id="current-day-indicator" class="text-gray-400 mt-1 text-lg font-medium">Monday</p>
    </header>

    <!-- Main Content: Slider -->
    <main class="flex-grow overflow-hidden relative">
        <div id="workout-slider" class="h-full flex transition-transform duration-300 ease-in-out">
            <!-- Workout day cards will be dynamically inserted here -->
        </div>
    </main>
    
    <!-- Footer & Navigation -->
    <footer class="p-4 bg-gray-900/80 backdrop-blur-sm border-t border-gray-800">
        <div class="flex justify-between items-center max-w-xl mx-auto">
            <button id="prev-day-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-5 rounded-lg transition-colors">&lt; Prev</button>
            <button id="edit-plan-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 px-5 rounded-lg transition-colors">Edit Plan</button>
            <button id="next-day-btn" class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-5 rounded-lg transition-colors">Next &gt;</button>
        </div>
    </footer>

    <!-- Modal for JSON Input -->
    <div id="json-modal" class="fixed inset-0 bg-black bg-opacity-70 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-gray-800 border border-gray-700 p-6 rounded-2xl shadow-lg w-full max-w-lg relative transform transition-all duration-300 scale-95 opacity-0" id="modal-content">
            <h2 class="text-2xl font-bold mb-4 text-white">Your Workout JSON</h2>
            <textarea id="json-input" class="w-full h-80 bg-gray-900 border border-gray-700 rounded-lg p-4 text-gray-300 text-sm font-mono focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition duration-200 resize-none" spellcheck="false"></textarea>
            <div id="error-message" class="mt-2 text-red-400 text-sm font-medium min-h-[20px]"></div>
            <div class="flex justify-end gap-4 mt-4">
                <button id="close-modal-btn" class="bg-gray-600 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded-lg transition-colors">Cancel</button>
                <button id="load-workout-btn" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded-lg transition-colors">Generate Plan</button>
            </div>
        </div>
    </div>


    <script>
        // DOM element references
        const jsonInput = document.getElementById('json-input');
        const loadWorkoutBtn = document.getElementById('load-workout-btn');
        const errorMessageContainer = document.getElementById('error-message');
        const slider = document.getElementById('workout-slider');
        const dayIndicator = document.getElementById('current-day-indicator');
        const prevBtn = document.getElementById('prev-day-btn');
        const nextBtn = document.getElementById('next-day-btn');

        // Modal elements
        const modal = document.getElementById('json-modal');
        const modalContent = document.getElementById('modal-content');
        const editPlanBtn = document.getElementById('edit-plan-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        
        let currentDayIndex = 0;
        const weekOrder = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
        let workoutProgress = {};
        
        // Default workout plan
        const defaultWorkoutJSON = { "Monday": { "workout": "Push Day", "exercises": [ { "name": "Bench Press", "sets": 4, "reps": "8-12" }, { "name": "Overhead Press", "sets": 3, "reps": "10-15" }, { "name": "Incline Dumbbell Press", "sets": 3, "reps": "10-15" }, { "name": "Tricep Pushdowns", "sets": 3, "reps": "12-15" }, { "name": "Lateral Raises", "sets": 4, "reps": "15-20" } ] }, "Tuesday": { "workout": "Pull Day", "exercises": [ { "name": "Pull-Ups", "sets": 4, "reps": "AMRAP" }, { "name": "Barbell Rows", "sets": 3, "reps": "8-12" }, { "name": "Face Pulls", "sets": 3, "reps": "15-20" }, { "name": "Bicep Curls", "sets": 3, "reps": "12-15" } ] }, "Wednesday": { "workout": "Rest Day", "exercises": [ { "name": "Light Cardio", "sets": 1, "reps": "30 min" }, { "name": "Stretching", "sets": 1, "reps": "15 min" } ] }, "Thursday": { "workout": "Leg Day", "exercises": [ { "name": "Squats", "sets": 4, "reps": "8-12" }, { "name": "Romanian Deadlifts", "sets": 3, "reps": "10-15" }, { "name": "Leg Press", "sets": 3, "reps": "12-15" }, { "name": "Leg Curls", "sets": 3, "reps": "12-15" }, { "name": "Calf Raises", "sets": 4, "reps": "15-20" } ] }, "Friday": { "workout": "Full Body", "exercises": [ { "name": "Deadlifts", "sets": 3, "reps": "5-8" }, { "name": "Dumbbell Bench Press", "sets": 3, "reps": "10-12" }, { "name": "Lat Pulldowns", "sets": 3, "reps": "10-15" }, { "name": "Leg Extensions", "sets": 3, "reps": "15-20" } ] }, "Saturday": { "workout": "Active Recovery", "exercises": [ { "name": "Jogging or Cycling", "sets": 1, "reps": "45 min" } ] }, "Sunday": { "workout": "Rest Day", "exercises": [ { "name": "Full Rest", "sets": 0, "reps": "All day" } ] } };

        function getTodayDateString() {
            const today = new Date();
            // Format as YYYY-MM-DD
            return `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
        }
        
        function loadProgress() {
            const todayStr = getTodayDateString();
            const savedProgress = localStorage.getItem('workoutProgress');
            if(savedProgress) {
                const parsed = JSON.parse(savedProgress);
                // Only load progress if it's for the current day
                if(parsed.date === todayStr) {
                    workoutProgress = parsed.progress || {};
                } else {
                    // It's a new day, clear old progress
                    localStorage.removeItem('workoutProgress');
                    workoutProgress = {};
                }
            } else {
                 workoutProgress = {};
            }
        }
        
        function saveProgress() {
            const todayStr = getTodayDateString();
            const dataToSave = {
                date: todayStr,
                progress: workoutProgress
            };
            localStorage.setItem('workoutProgress', JSON.stringify(dataToSave));
        }

        function renderWorkoutPlan() {
            slider.innerHTML = '';
            errorMessageContainer.textContent = '';
            let workoutData;
            try {
                workoutData = JSON.parse(jsonInput.value);
            } catch (error) {
                errorMessageContainer.textContent = 'Invalid JSON format.';
                return;
            }

            weekOrder.forEach((day, dayIndex) => {
                const dayData = workoutData[day];
                const dayContainer = document.createElement('div');
                dayContainer.className = "w-full h-full flex-shrink-0 p-4 sm:p-6 overflow-y-auto";

                if (dayData && dayData.exercises) {
                    const isRestDay = dayData.workout.toLowerCase().includes('rest');
                    const tagColor = isRestDay ? 'bg-blue-900 text-blue-300' : 'bg-emerald-900 text-emerald-300';
                    
                    let exercisesHtml = '<ul class="space-y-4 text-gray-300 flex-grow">';
                    dayData.exercises.forEach((ex, exIndex) => {
                        const isDone = workoutProgress[day] && workoutProgress[day][exIndex];
                        exercisesHtml += `
                            <li class="exercise-item flex justify-between items-center text-base p-4 bg-gray-800/60 border border-gray-700 rounded-lg cursor-pointer transition-all ${isDone ? 'exercise-done' : ''}" data-day="${day}" data-ex-index="${exIndex}">
                                <span class="flex-1 pr-2 font-medium">${ex.name}</span>
                                <span class="font-semibold text-gray-400 whitespace-nowrap">${ex.sets} x ${ex.reps}</span>
                            </li>
                        `;
                    });
                    exercisesHtml += '</ul>';

                    dayContainer.innerHTML = `
                        <div class="max-w-xl mx-auto">
                           <div class="flex justify-between items-center mb-4">
                                <h3 class="text-xl font-bold text-white">${dayData.workout}</h3>
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full ${tagColor}">${day.toUpperCase()}</span>
                            </div>
                            ${exercisesHtml}
                        </div>
                    `;
                } else {
                     dayContainer.innerHTML = `<div class="text-center text-gray-500 pt-20">No workout scheduled for ${day}.</div>`;
                }
                slider.appendChild(dayContainer);
            });
            
            addExerciseListeners();
            updateSlider();
            closeModal();
        }

        function addExerciseListeners() {
            document.querySelectorAll('.exercise-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const target = e.currentTarget;
                    const day = target.dataset.day;
                    const exIndex = parseInt(target.dataset.exIndex);
                    
                    // Initialize progress for the day if it doesn't exist
                    if(!workoutProgress[day]) {
                        workoutProgress[day] = [];
                    }
                    
                    // Toggle progress
                    workoutProgress[day][exIndex] = !workoutProgress[day][exIndex];
                    
                    target.classList.toggle('exercise-done');
                    saveProgress();
                });
            });
        }

        function updateSlider() {
            slider.style.transform = `translateX(-${currentDayIndex * 100}%)`;
            dayIndicator.textContent = weekOrder[currentDayIndex];
            // Disable/enable buttons at the start/end
            prevBtn.disabled = currentDayIndex === 0;
            nextBtn.disabled = currentDayIndex === weekOrder.length - 1;
            prevBtn.classList.toggle('opacity-50', currentDayIndex === 0);
            nextBtn.classList.toggle('opacity-50', currentDayIndex === weekOrder.length - 1);
        }
        
        function showNextDay() {
            if (currentDayIndex < weekOrder.length - 1) {
                currentDayIndex++;
                updateSlider();
            }
        }
        
        function showPrevDay() {
            if (currentDayIndex > 0) {
                currentDayIndex--;
                updateSlider();
            }
        }

        // --- Modal Logic ---
        function openModal() {
            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
        
        // --- Swipe Logic ---
        let touchstartX = 0;
        let touchendX = 0;
            
        function handleGesture() {
            if (touchendX < touchstartX - 50) showNextDay(); // Swiped left
            if (touchendX > touchstartX + 50) showPrevDay(); // Swiped right
        }

        slider.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX });
        slider.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleGesture(); });

        // --- INITIALIZATION ---
        editPlanBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); }); // Close on overlay click
        loadWorkoutBtn.addEventListener('click', renderWorkoutPlan);
        prevBtn.addEventListener('click', showPrevDay);
        nextBtn.addEventListener('click', showNextDay);
        
        // Initial setup
        loadProgress();
        jsonInput.value = JSON.stringify(defaultWorkoutJSON, null, 4);
        const today = new Date().getDay(); // Sunday = 0, Monday = 1, etc.
        currentDayIndex = (today === 0) ? 6 : today - 1; // Adjust to match our weekOrder array
        renderWorkoutPlan();
    </script>
</body>
</html>
